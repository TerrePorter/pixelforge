# nginx site for Pixelforge.
#
# Ubuntu/Debian: /etc/nginx/sites-available/pixelforge, then symlink into sites-enabled.
# Amazon Linux / RHEL: /etc/nginx/conf.d/pixelforge.conf, and change fastcgi_pass to
#   unix:/run/php-fpm/www.sock
#
# Replace your-domain and the paths, then run `nginx -t`. HTTPS: `certbot --nginx -d your-domain`
# adds the 443 server block and the HTTP-to-HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain;

    root /var/www/pixelforge/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite's hashed build files never change, so let browsers keep them.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Only the front controller runs; any other .php file is not served.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
