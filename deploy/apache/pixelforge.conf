# Apache httpd virtual host for Pixelforge, with PHP-FPM.
#
# Amazon Linux / RHEL (httpd):
#   dnf install -y httpd php8.3-fpm ...    (mod_rewrite and mod_proxy_fcgi are on by default)
#   cp deploy/apache/pixelforge.conf /etc/httpd/conf.d/pixelforge.conf
#   The PHP-FPM socket is /run/php-fpm/www.sock and logs go to /var/log/httpd, as below.
#
# Ubuntu/Debian (apache2):
#   a2enmod rewrite proxy_fcgi setenvif headers expires
#   cp deploy/apache/pixelforge.conf /etc/apache2/sites-available/pixelforge.conf
#   a2ensite pixelforge && a2dissite 000-default
#   Change the socket to /run/php/php8.3-fpm.sock and the logs to /var/log/apache2.
#
# Replace your-domain and the paths, then run `apachectl configtest`. HTTPS:
# `certbot --apache -d your-domain` adds the 443 virtual host and the redirect.
#
# URL rewriting is done by Laravel's own public/.htaccess, which is why AllowOverride
# is on for public/ only.

<VirtualHost *:80>
    ServerName your-domain
    DocumentRoot /var/www/pixelforge/public

    <Directory /var/www/pixelforge/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hand PHP to PHP-FPM.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>

    # Never serve dotfiles (.env lives outside public/, but be safe).
    <LocationMatch "/\.(?!well-known)">
        Require all denied
    </LocationMatch>

    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>

    # Vite's hashed build files never change, so let browsers keep them.
    <IfModule mod_expires.c>
        <Directory /var/www/pixelforge/public/build>
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </Directory>
    </IfModule>

    ErrorLog /var/log/httpd/pixelforge-error.log
    CustomLog /var/log/httpd/pixelforge-access.log combined
</VirtualHost>
