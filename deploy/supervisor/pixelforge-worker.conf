; Queue worker for Pixelforge. Without it, generations are never sent to Pixelforge.
;
; Ubuntu/Debian: /etc/supervisor/conf.d/pixelforge-worker.conf
; RHEL: /etc/supervisord.d/pixelforge-worker.ini
; Then: supervisorctl reread && supervisorctl update
;
; user must be PHP-FPM's user (`user =` in the FPM pool config), not necessarily the web
; server's: www-data on Ubuntu, apache on RHEL even when nginx serves the site.
; umask=002 keeps the files the worker creates writable by the shared www-data group.
; Amazon Linux 2023 has no supervisor package; use
; deploy/systemd/pixelforge-worker.service there instead.
;
; --tries=0 leaves retries to the SubmitGeneration job, which sets its own limits.
; deploy.sh runs `php artisan queue:restart`; the worker then exits after its current
; job and supervisor starts it again on the new code.

[program:pixelforge-worker]
command=php /var/www/pixelforge/artisan queue:work --sleep=1 --tries=0 --max-time=3600
directory=/var/www/pixelforge
user=www-data
umask=002
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/pixelforge/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
